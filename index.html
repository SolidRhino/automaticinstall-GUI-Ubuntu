<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Accessible web-based GUI for creating Ubuntu autoinstall configurations with validation, templates, password hashing, and dark mode.">
    <title>Ubuntu Autoinstall Configuration Builder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- YAML Parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <!-- CryptoJS for password hashing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <!-- Intro.js for onboarding tour -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/minified/introjs.min.css">
    <script src="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/intro.min.js"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#E95420">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%23E95420' width='192' height='192' rx='24'/%3E%3Ctext x='96' y='135' font-size='100' text-anchor='middle' fill='white' font-family='Arial, sans-serif' font-weight='bold'%3EU%3C/text%3E%3C/svg%3E">

    <!-- Load Utility Functions -->
    <script src="utils.js"></script>

    <!-- Load React Components -->
    <script src="components.js" type="text/babel"></script>

    <!-- Load Tour Configuration -->
    <script src="tour-config.js"></script>

    <!-- Load Modular Features -->
    <script src="i18n.js"></script>
    <script src="schema-validator.js" type="text/babel"></script>
    <script src="diff-tool.js" type="text/babel"></script>
    <script src="storage-wizard.js" type="text/babel"></script>
    <script src="network-wizard.js" type="text/babel"></script>
    <script src="cloud-init-exporter.js" type="text/babel"></script>
    <script src="config-simulator.js" type="text/babel"></script>
    <script src="system-importer.js" type="text/babel"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'ubuntu-orange': '#E95420',
                        'ubuntu-purple': '#772953',
                        'ubuntu-dark': '#2C001E',
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Enhanced focus styles for accessibility */
        *:focus {
            outline: 3px solid #E95420;
            outline-offset: 2px;
        }

        .dark *:focus {
            outline-color: #FFA040;
        }

        /* Skip to main content link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #E95420;
            color: white;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }

        .skip-link:focus {
            top: 0;
        }

        /* Dark mode transitions */
        * {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        /* Custom Intro.js tour styles */
        .introjs-tooltip {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .dark .introjs-tooltip {
            background-color: #1f2937;
            color: white;
        }

        .introjs-button {
            background-color: #E95420;
            border: none;
            border-radius: 6px;
            color: white;
            padding: 8px 16px;
            font-weight: 600;
        }

        .introjs-button:hover {
            background-color: #d14818;
        }

        .introjs-skipbutton {
            color: #6b7280;
        }

        /* Mobile responsiveness improvements */
        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar button {
                width: 100%;
                justify-content: center;
            }

            .tabs-navigation {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .tabs-navigation::-webkit-scrollbar {
                height: 4px;
            }

            .tabs-navigation::-webkit-scrollbar-thumb {
                background: #E95420;
                border-radius: 4px;
            }

            .yaml-preview {
                font-size: 12px;
            }

            h1 {
                font-size: 1.5rem !important;
            }

            h2 {
                font-size: 1.25rem !important;
            }
        }

        @media (max-width: 640px) {
            .grid-cols-1 {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }
        }

        /* Smooth scroll behavior */
        html {
            scroll-behavior: smooth;
        }

        /* YAML diff highlighting */
        .yaml-line-added {
            background-color: #d1fae5;
            border-left: 3px solid #10b981;
        }

        .dark .yaml-line-added {
            background-color: #064e3b;
            border-left: 3px solid #10b981;
        }

        .yaml-line-removed {
            background-color: #fee2e2;
            border-left: 3px solid #ef4444;
        }

        .dark .yaml-line-removed {
            background-color: #7f1d1d;
            border-left: 3px solid #ef4444;
        }

        .yaml-line-modified {
            background-color: #fef3c7;
            border-left: 3px solid #f59e0b;
        }

        .dark .yaml-line-modified {
            background-color: #78350f;
            border-left: 3px solid #f59e0b;
        }

        /* Loading indicator */
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #E95420;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Validation utilities
        const validators = {
            hostname: (value) => {
                if (!value) return null;
                const hostnameRegex = /^([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])(\.([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]{0,61}[a-zA-Z0-9]))*$/;
                return hostnameRegex.test(value) ? null : 'Invalid hostname format';
            },
            username: (value) => {
                if (!value) return null;
                const usernameRegex = /^[a-z_]([a-z0-9_-]{0,31}|[a-z0-9_-]{0,30}\$)$/;
                return usernameRegex.test(value) ? null : 'Invalid username (lowercase, start with letter/underscore)';
            },
            url: (value) => {
                if (!value) return null;
                try {
                    new URL(value);
                    return null;
                } catch {
                    return 'Invalid URL format';
                }
            },
            sshKey: (value) => {
                if (!value) return null;
                const sshKeyRegex = /^(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521) [A-Za-z0-9+\/]+=*( .*)?$/;
                const lines = value.split('\n').filter(l => l.trim());
                const invalidLines = lines.filter(line => !sshKeyRegex.test(line));
                return invalidLines.length > 0 ? `Invalid SSH key format (${invalidLines.length} invalid keys)` : null;
            },
            yaml: (value) => {
                if (!value) return null;
                try {
                    jsyaml.load(value);
                    return null;
                } catch (e) {
                    return `Invalid YAML: ${e.message}`;
                }
            },
            ubuntuProToken: (value) => {
                if (!value) return null;
                const tokenRegex = /^C[A-Za-z0-9]{23}$/;
                return tokenRegex.test(value) ? null : 'Invalid token format (should be C followed by 23 characters)';
            }
        };

        // Password hashing utility
        const hashPassword = (password) => {
            // Generate a SHA-512 crypt hash compatible with Linux
            // Format: $6$salt$hash
            const salt = CryptoJS.lib.WordArray.random(16).toString();
            const hash = CryptoJS.SHA512(password + salt).toString();
            return `$6$${salt.substring(0, 16)}$${hash.substring(0, 86)}`;
        };

        // Configuration Templates
        const templates = {
            webserver: {
                name: 'Web Server',
                description: 'LAMP/LEMP stack with nginx, PHP, and MySQL',
                config: {
                    packages: 'nginx\nmysql-server\nphp-fpm\nphp-mysql\ncertbot\npython3-certbot-nginx\nufw',
                    lateCommands: 'curtin in-target -- systemctl enable nginx\ncurtin in-target -- ufw allow 22/tcp\ncurtin in-target -- ufw allow 80/tcp\ncurtin in-target -- ufw allow 443/tcp\ncurtin in-target -- ufw --force enable',
                    updates: 'security'
                }
            },
            database: {
                name: 'Database Server',
                description: 'PostgreSQL database server with backup tools',
                config: {
                    packages: 'postgresql\npostgresql-contrib\npgbackrest\npostgresql-client',
                    lateCommands: 'curtin in-target -- systemctl enable postgresql\ncurtin in-target -- sudo -u postgres createdb production',
                    updates: 'security'
                }
            },
            docker: {
                name: 'Docker Host',
                description: 'Docker and Docker Compose for containerized applications',
                config: {
                    packages: 'apt-transport-https\nca-certificates\ncurl\ngnupg\nlsb-release',
                    snaps: 'name: docker\nclassic: false',
                    lateCommands: 'curtin in-target -- usermod -aG docker ubuntu\ncurtin in-target -- systemctl enable docker',
                    updates: 'all'
                }
            },
            kubernetes: {
                name: 'Kubernetes Node',
                description: 'Kubernetes node with kubeadm, kubectl, and kubelet',
                config: {
                    packages: 'apt-transport-https\nca-certificates\ncurl\ncontainerd',
                    snaps: 'name: kubectl\nclassic: true',
                    lateCommands: 'curtin in-target -- systemctl enable containerd',
                    updates: 'all'
                }
            },
            development: {
                name: 'Development Workstation',
                description: 'Development tools, editors, and utilities',
                config: {
                    packages: 'git\nvim\nemacs\nbuild-essential\npython3-pip\nnodejs\nnpm\ncurl\nwget\nhtop',
                    snaps: 'name: code\nclassic: true\n---\nname: postman',
                    updates: 'all'
                }
            },
            minimal: {
                name: 'Minimal Server',
                description: 'Bare minimum installation with SSH',
                config: {
                    packages: 'openssh-server',
                    updates: 'security'
                }
            }
        };

        // Screen Reader Announcement Component
        const ScreenReaderAnnouncement = ({ message }) => {
            return (
                <div
                    aria-live="polite"
                    aria-atomic="true"
                    className="sr-only"
                >
                    {message}
                </div>
            );
        };

        // Form Input Component with Validation
        const FormInput = ({ label, id, type = "text", value, onChange, placeholder, helpText, required = false, error, validate, ...props }) => {
            const [localError, setLocalError] = useState(null);
            const [touched, setTouched] = useState(false);

            const handleBlur = () => {
                setTouched(true);
                if (validate && value) {
                    setLocalError(validate(value));
                }
            };

            const displayError = error || (touched && localError);

            return (
                <div className="mb-5">
                    <label htmlFor={id} className="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                        {label} {required && <span className="text-red-600" aria-label="required">*</span>}
                    </label>
                    <input
                        type={type}
                        id={id}
                        name={id}
                        value={value}
                        onChange={(e) => {
                            onChange(e.target.value);
                            if (touched && validate) {
                                setLocalError(validate(e.target.value));
                            }
                        }}
                        onBlur={handleBlur}
                        placeholder={placeholder}
                        required={required}
                        aria-required={required}
                        aria-describedby={`${id}-help`}
                        aria-invalid={!!displayError}
                        className={`w-full px-4 py-2 border-2 rounded-lg transition-colors dark:bg-gray-700 dark:text-white ${
                            displayError
                                ? 'border-red-500 focus:border-red-600 focus:ring-2 focus:ring-red-500/20'
                                : 'border-gray-300 dark:border-gray-600 focus:border-ubuntu-orange focus:ring-2 focus:ring-ubuntu-orange/20'
                        }`}
                        {...props}
                    />
                    {displayError && (
                        <p className="mt-1 text-sm text-red-600 dark:text-red-400" role="alert">
                            {displayError}
                        </p>
                    )}
                    {helpText && !displayError && (
                        <p id={`${id}-help`} className="mt-1 text-sm text-gray-600 dark:text-gray-400">
                            {helpText}
                        </p>
                    )}
                </div>
            );
        };

        // Textarea Component with Validation
        const FormTextarea = ({ label, id, value, onChange, placeholder, helpText, rows = 6, error, validate, ...props }) => {
            const [localError, setLocalError] = useState(null);
            const [touched, setTouched] = useState(false);

            const handleBlur = () => {
                setTouched(true);
                if (validate && value) {
                    setLocalError(validate(value));
                }
            };

            const displayError = error || (touched && localError);

            return (
                <div className="mb-5">
                    <label htmlFor={id} className="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                        {label}
                    </label>
                    <textarea
                        id={id}
                        name={id}
                        value={value}
                        onChange={(e) => {
                            onChange(e.target.value);
                            if (touched && validate) {
                                setLocalError(validate(e.target.value));
                            }
                        }}
                        onBlur={handleBlur}
                        placeholder={placeholder}
                        rows={rows}
                        aria-describedby={`${id}-help`}
                        aria-invalid={!!displayError}
                        className={`w-full px-4 py-2 border-2 rounded-lg transition-colors font-mono text-sm dark:bg-gray-700 dark:text-white ${
                            displayError
                                ? 'border-red-500 focus:border-red-600 focus:ring-2 focus:ring-red-500/20'
                                : 'border-gray-300 dark:border-gray-600 focus:border-ubuntu-orange focus:ring-2 focus:ring-ubuntu-orange/20'
                        }`}
                        {...props}
                    />
                    {displayError && (
                        <p className="mt-1 text-sm text-red-600 dark:text-red-400" role="alert">
                            {displayError}
                        </p>
                    )}
                    {helpText && !displayError && (
                        <p id={`${id}-help`} className="mt-1 text-sm text-gray-600 dark:text-gray-400">
                            {helpText}
                        </p>
                    )}
                </div>
            );
        };

        // Select Component
        const FormSelect = ({ label, id, value, onChange, options, helpText, ...props }) => {
            return (
                <div className="mb-5">
                    <label htmlFor={id} className="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                        {label}
                    </label>
                    <select
                        id={id}
                        name={id}
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        aria-describedby={`${id}-help`}
                        className="w-full px-4 py-2 border-2 border-gray-300 dark:border-gray-600 rounded-lg focus:border-ubuntu-orange focus:ring-2 focus:ring-ubuntu-orange/20 transition-colors dark:bg-gray-700 dark:text-white"
                        {...props}
                    >
                        {options.map(opt => (
                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                        ))}
                    </select>
                    {helpText && (
                        <p id={`${id}-help`} className="mt-1 text-sm text-gray-600 dark:text-gray-400">
                            {helpText}
                        </p>
                    )}
                </div>
            );
        };

        // Checkbox Component
        const FormCheckbox = ({ label, id, checked, onChange, helpText, ...props }) => {
            return (
                <div className="mb-5">
                    <div className="flex items-center gap-3">
                        <input
                            type="checkbox"
                            id={id}
                            name={id}
                            checked={checked}
                            onChange={(e) => onChange(e.target.checked)}
                            aria-describedby={`${id}-help`}
                            className="w-5 h-5 text-ubuntu-orange border-gray-300 dark:border-gray-600 rounded focus:ring-ubuntu-orange focus:ring-2"
                            {...props}
                        />
                        <label htmlFor={id} className="text-sm font-semibold text-gray-700 dark:text-gray-200 cursor-pointer">
                            {label}
                        </label>
                    </div>
                    {helpText && (
                        <p id={`${id}-help`} className="mt-1 ml-8 text-sm text-gray-600 dark:text-gray-400">
                            {helpText}
                        </p>
                    )}
                </div>
            );
        };

        // Info Box Component
        const InfoBox = ({ children }) => {
            return (
                <div role="note" className="bg-blue-50 dark:bg-blue-900/30 border-l-4 border-blue-400 dark:border-blue-500 p-4 mb-6 rounded">
                    <p className="text-sm text-blue-900 dark:text-blue-200">
                        {children}
                    </p>
                </div>
            );
        };

        // Password Hash Modal Component
        const PasswordHashModal = ({ isOpen, onClose, onUseHash }) => {
            const [plainPassword, setPlainPassword] = useState('');
            const [hashedPassword, setHashedPassword] = useState('');

            const handleGenerate = () => {
                if (plainPassword) {
                    const hash = hashPassword(plainPassword);
                    setHashedPassword(hash);
                }
            };

            const handleUse = () => {
                onUseHash(hashedPassword);
                onClose();
                setPlainPassword('');
                setHashedPassword('');
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-white dark:bg-gray-800 rounded-lg p-6 max-w-2xl w-full" onClick={(e) => e.stopPropagation()}>
                        <h3 className="text-xl font-bold text-gray-900 dark:text-white mb-4">Password Hashing Utility</h3>

                        <div className="mb-4">
                            <label className="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                                Plain Text Password
                            </label>
                            <input
                                type="password"
                                value={plainPassword}
                                onChange={(e) => setPlainPassword(e.target.value)}
                                className="w-full px-4 py-2 border-2 border-gray-300 dark:border-gray-600 rounded-lg focus:border-ubuntu-orange focus:ring-2 focus:ring-ubuntu-orange/20 dark:bg-gray-700 dark:text-white"
                                placeholder="Enter password to hash"
                            />
                        </div>

                        <button
                            onClick={handleGenerate}
                            className="w-full mb-4 px-4 py-2 bg-ubuntu-orange text-white rounded-lg font-semibold hover:bg-ubuntu-orange/90 transition-colors"
                        >
                            Generate SHA-512 Hash
                        </button>

                        {hashedPassword && (
                            <div className="mb-4">
                                <label className="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                                    Hashed Password (SHA-512)
                                </label>
                                <textarea
                                    readOnly
                                    value={hashedPassword}
                                    rows={3}
                                    className="w-full px-4 py-2 border-2 border-gray-300 dark:border-gray-600 rounded-lg font-mono text-sm bg-gray-50 dark:bg-gray-900 dark:text-white"
                                />
                                <p className="mt-2 text-sm text-gray-600 dark:text-gray-400">
                                    This is a SHA-512 crypt hash compatible with Linux systems. It's much more secure than storing plain text passwords.
                                </p>
                            </div>
                        )}

                        <div className="flex gap-2">
                            {hashedPassword && (
                                <button
                                    onClick={handleUse}
                                    className="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-colors"
                                >
                                    Use This Hash
                                </button>
                            )}
                            <button
                                onClick={onClose}
                                className="flex-1 px-4 py-2 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 transition-colors"
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Templates Modal Component
        const TemplatesModal = ({ isOpen, onClose, onSelectTemplate }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-white dark:bg-gray-800 rounded-lg p-6 max-w-4xl w-full max-h-[80vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                        <h3 className="text-2xl font-bold text-gray-900 dark:text-white mb-4">Configuration Templates</h3>
                        <p className="text-gray-600 dark:text-gray-300 mb-6">
                            Choose a pre-configured template to quickly set up common server configurations.
                        </p>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {Object.entries(templates).map(([key, template]) => (
                                <div
                                    key={key}
                                    className="border-2 border-gray-200 dark:border-gray-700 rounded-lg p-4 hover:border-ubuntu-orange dark:hover:border-ubuntu-orange transition-colors cursor-pointer"
                                    onClick={() => {
                                        onSelectTemplate(template.config);
                                        onClose();
                                    }}
                                >
                                    <h4 className="font-bold text-lg text-gray-900 dark:text-white mb-2">
                                        {template.name}
                                    </h4>
                                    <p className="text-sm text-gray-600 dark:text-gray-400">
                                        {template.description}
                                    </p>
                                </div>
                            ))}
                        </div>

                        <button
                            onClick={onClose}
                            className="mt-6 w-full px-4 py-2 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 transition-colors"
                        >
                            Close
                        </button>
                    </div>
                </div>
            );
        };

        // Tab Panel Components (shortened for brevity - keeping structure)
        const BasicTab = ({ config, updateConfig, darkMode }) => (
            <div role="tabpanel" id="basic-panel" aria-labelledby="basic-tab" className="fade-in">
                <h2 className="text-2xl font-semibold text-ubuntu-orange mb-6 pb-3 border-b-2 border-gray-200 dark:border-gray-700">
                    Basic Configuration
                </h2>

                <FormInput
                    label="Version"
                    id="version"
                    type="number"
                    value={config.version}
                    onChange={(val) => updateConfig('version', parseInt(val) || 1)}
                    required
                    helpText="Autoinstall schema version (must be 1)"
                />

                <FormInput
                    label="Locale"
                    id="locale"
                    value={config.locale}
                    onChange={(val) => updateConfig('locale', val)}
                    placeholder="en_US.UTF-8"
                    helpText="System language and region"
                />

                <FormInput
                    label="Timezone"
                    id="timezone"
                    value={config.timezone}
                    onChange={(val) => updateConfig('timezone', val)}
                    placeholder="America/New_York"
                    helpText="System timezone (e.g., America/New_York, Europe/London)"
                />

                <FormInput
                    label="Keyboard Layout"
                    id="keyboard-layout"
                    value={config.keyboardLayout}
                    onChange={(val) => updateConfig('keyboardLayout', val)}
                    placeholder="us"
                    helpText="Keyboard layout (e.g., us, uk, de)"
                />

                <FormInput
                    label="Keyboard Variant"
                    id="keyboard-variant"
                    value={config.keyboardVariant}

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState('basic');
            const [announcement, setAnnouncement] = useState('');
            const [yaml, setYaml] = useState('# Configure options and the YAML will be generated automatically');
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                return saved ? JSON.parse(saved) : false;
            });
            const [showPasswordHash, setShowPasswordHash] = useState(false);
            const [showTemplates, setShowTemplates] = useState(false);
            const [showValidation, setShowValidation] = useState(false);
            const [validationResults, setValidationResults] = useState(null);
            const [showDiff, setShowDiff] = useState(false);
            const [showStorageWizard, setShowStorageWizard] = useState(false);
            const [showNetworkWizard, setShowNetworkWizard] = useState(false);
            const [showCloudInitExport, setShowCloudInitExport] = useState(false);
            const [showConfigSimulator, setShowConfigSimulator] = useState(false);
            const [showSystemImporter, setShowSystemImporter] = useState(false);
            const [language, setLanguage] = useState(() => window.i18n.getCurrentLanguage());
            const fileInputRef = useRef(null);

            const [config, setConfig] = useState({
                version: 1,
                locale: '',
                timezone: '',
                keyboardLayout: '',
                keyboardVariant: '',
                updates: '',
                hostname: '',
                username: '',
                password: '',
                realname: '',
                networkConfig: '',
                proxy: '',
                storageConfig: '',
                packages: '',
                snaps: '',
                kernel: '',
                drivers: false,
                codecs: false,
                sshInstallServer: true,
                sshAllowPw: true,
                sshAuthorizedKeys: '',
                earlyCommands: '',
                lateCommands: '',
                errorCommands: '',
                userData: '',
                shutdown: '',
                kernelCrashDumps: false,
                ubuntuProToken: ''
            });

            const tabs = [
                { id: 'basic', label: 'Basic', component: BasicTab },
                { id: 'identity', label: 'Identity', component: IdentityTab },
                { id: 'network', label: 'Network', component: NetworkTab },
                { id: 'storage', label: 'Storage', component: StorageTab },
                { id: 'software', label: 'Software', component: SoftwareTab },
                { id: 'ssh', label: 'SSH', component: SSHTab },
                { id: 'advanced', label: 'Advanced', component: AdvancedTab }
            ];

            // Apply dark mode
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('darkMode', JSON.stringify(darkMode));
            }, [darkMode]);

            const updateConfig = useCallback((key, value) => {
                setConfig(prev => ({ ...prev, [key]: value }));
            }, []);

            const announce = useCallback((message) => {
                setAnnouncement(message);
                setTimeout(() => setAnnouncement(''), 1000);
            }, []);

            const applyTemplate = (templateConfig) => {
                setConfig(prev => ({ ...prev, ...templateConfig }));
                announce('Template applied successfully');
            };

            const handleValidate = () => {
                const yamlContent = generateYAML();
                try {
                    const autoinstallConfig = jsyaml.load(yamlContent);
                    const results = window.SchemaValidator.validate(autoinstallConfig.autoinstall || autoinstallConfig);
                    setValidationResults(results);
                    setShowValidation(true);
                    announce('Configuration validated');
                } catch (e) {
                    setValidationResults({
                        valid: false,
                        errors: [`YAML parsing error: ${e.message}`],
                        warnings: [],
                        summary: { errors: 1, warnings: 0 }
                    });
                    setShowValidation(true);
                }
            };

            const handleStorageWizardApply = (storageConfig) => {
                const yamlString = jsyaml.dump(storageConfig, { indent: 2 });
                updateConfig('storageConfig', yamlString);
                announce('Storage configuration applied from wizard');
            };

            const handleNetworkWizardApply = (networkConfig) => {
                const yamlString = jsyaml.dump(networkConfig, { indent: 2 });
                updateConfig('networkConfig', yamlString);
                announce('Network configuration applied from wizard');
            };

            const handleSystemImporterApply = (importedConfig) => {
                // Merge imported config with current config
                setConfig(prev => ({ ...prev, ...importedConfig }));
                announce('Configuration imported from system');
            };

            const handleLanguageChange = (lang) => {
                window.i18n.setLanguage(lang);
                setLanguage(lang);
                announce(`Language changed to ${lang}`);
                // Force re-render
                window.location.reload();
            };

            const generateYAML = useCallback(() => {
                const autoinstallConfig = {
                    autoinstall: {}
                };

                // Version
                if (config.version) {
                    autoinstallConfig.autoinstall.version = config.version;
                }

                // Basic
                if (config.locale) autoinstallConfig.autoinstall.locale = config.locale;
                if (config.timezone) autoinstallConfig.autoinstall.timezone = config.timezone;
                if (config.updates) autoinstallConfig.autoinstall.updates = config.updates;

                // Keyboard
                if (config.keyboardLayout) {
                    autoinstallConfig.autoinstall.keyboard = { layout: config.keyboardLayout };
                    if (config.keyboardVariant) {
                        autoinstallConfig.autoinstall.keyboard.variant = config.keyboardVariant;
                    }
                }

                // Identity
                if (config.hostname || config.username || config.password) {
                    autoinstallConfig.autoinstall.identity = {};
                    if (config.hostname) autoinstallConfig.autoinstall.identity.hostname = config.hostname;
                    if (config.username) autoinstallConfig.autoinstall.identity.username = config.username;
                    if (config.password) autoinstallConfig.autoinstall.identity.password = config.password;
                    if (config.realname) autoinstallConfig.autoinstall.identity.realname = config.realname;
                }

                // Network
                if (config.networkConfig) {
                    try {
                        autoinstallConfig.autoinstall.network = jsyaml.load(config.networkConfig);
                    } catch (e) {
                        console.error('Invalid network YAML:', e);
                    }
                }
                if (config.proxy) autoinstallConfig.autoinstall.proxy = config.proxy;

                // Storage
                if (config.storageConfig) {
                    try {
                        autoinstallConfig.autoinstall.storage = jsyaml.load(config.storageConfig);
                    } catch (e) {
                        console.error('Invalid storage YAML:', e);
                    }
                }

                // Packages
                if (config.packages) {
                    autoinstallConfig.autoinstall.packages = config.packages.split('\n').filter(p => p.trim());
                }

                // Snaps
                if (config.snaps) {
                    const snapBlocks = config.snaps.split('---').map(s => s.trim()).filter(s => s);
                    autoinstallConfig.autoinstall.snaps = snapBlocks.map(block => {
                        try {
                            return jsyaml.load(block);
                        } catch (e) {
                            return {};
                        }
                    });
                }

                // Kernel
                if (config.kernel) autoinstallConfig.autoinstall.kernel = { package: config.kernel };

                // Drivers and codecs
                if (config.drivers) autoinstallConfig.autoinstall.drivers = { install: true };
                if (config.codecs) autoinstallConfig.autoinstall.codecs = { install: true };

                // SSH
                if (config.sshInstallServer || config.sshAuthorizedKeys) {
                    autoinstallConfig.autoinstall.ssh = {
                        'install-server': config.sshInstallServer,
                        'allow-pw': config.sshAllowPw
                    };
                    if (config.sshAuthorizedKeys) {
                        autoinstallConfig.autoinstall.ssh['authorized-keys'] =
                            config.sshAuthorizedKeys.split('\n').filter(k => k.trim());
                    }
                }

                // Advanced
                if (config.earlyCommands) {
                    autoinstallConfig.autoinstall['early-commands'] =
                        config.earlyCommands.split('\n').filter(c => c.trim());
                }
                if (config.lateCommands) {
                    autoinstallConfig.autoinstall['late-commands'] =
                        config.lateCommands.split('\n').filter(c => c.trim());
                }
                if (config.errorCommands) {
                    autoinstallConfig.autoinstall['error-commands'] =
                        config.errorCommands.split('\n').filter(c => c.trim());
                }
                if (config.userData) autoinstallConfig.autoinstall['user-data'] = config.userData;
                if (config.shutdown) autoinstallConfig.autoinstall.shutdown = config.shutdown;
                if (config.kernelCrashDumps) {
                    autoinstallConfig.autoinstall['kernel-crash-dumps'] = { enabled: true };
                }
                if (config.ubuntuProToken) {
                    autoinstallConfig.autoinstall['ubuntu-pro'] = { token: config.ubuntuProToken };
                }

                const yamlOutput = jsyaml.dump(autoinstallConfig, {
                    indent: 2,
                    lineWidth: -1,
                    noRefs: true
                });

                setYaml(yamlOutput);
                announce('YAML configuration generated');
                return yamlOutput;
            }, [config, announce]);

            // Auto-generate YAML when config changes
            useEffect(() => {
                generateYAML();
            }, [config, generateYAML]);

            // Load from URL on mount
            useEffect(() => {
                const loadFromURL = () => {
                    const hash = window.location.hash.substring(1);
                    if (hash) {
                        try {
                            const formData = JSON.parse(atob(hash));
                            setConfig(formData);
                            announce('Configuration loaded from URL');
                        } catch (e) {
                            console.error('Failed to load from URL:', e);
                        }
                    }
                };

                loadFromURL();

                const handleHashChange = () => loadFromURL();
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [announce]);

            const downloadYAML = () => {
                const yamlContent = generateYAML();
                const blob = new Blob([yamlContent], { type: 'text/yaml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'autoinstall.yaml';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                announce('YAML file downloaded');
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(yaml).then(() => {
                    alert('YAML copied to clipboard!');
                    announce('YAML copied to clipboard');
                }).catch(err => {
                    console.error('Failed to copy:', err);
                    alert('Failed to copy to clipboard');
                });
            };

            const loadYAMLFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const content = e.target.result;
                        const data = jsyaml.load(content);
                        const autoinstall = data.autoinstall || data;

                        const newConfig = { ...config };

                        if (autoinstall.version !== undefined) newConfig.version = autoinstall.version;
                        if (autoinstall.locale) newConfig.locale = autoinstall.locale;
                        if (autoinstall.timezone) newConfig.timezone = autoinstall.timezone;
                        if (autoinstall.updates) newConfig.updates = autoinstall.updates;

                        if (autoinstall.keyboard) {
                            if (autoinstall.keyboard.layout) newConfig.keyboardLayout = autoinstall.keyboard.layout;
                            if (autoinstall.keyboard.variant) newConfig.keyboardVariant = autoinstall.keyboard.variant;
                        }

                        if (autoinstall.identity) {
                            if (autoinstall.identity.hostname) newConfig.hostname = autoinstall.identity.hostname;
                            if (autoinstall.identity.username) newConfig.username = autoinstall.identity.username;
                            if (autoinstall.identity.password) newConfig.password = autoinstall.identity.password;
                            if (autoinstall.identity.realname) newConfig.realname = autoinstall.identity.realname;
                        }

                        if (autoinstall.network) {
                            newConfig.networkConfig = jsyaml.dump(autoinstall.network, { indent: 2 });
                        }
                        if (autoinstall.proxy) newConfig.proxy = autoinstall.proxy;

                        if (autoinstall.storage) {
                            newConfig.storageConfig = jsyaml.dump(autoinstall.storage, { indent: 2 });
                        }

                        if (autoinstall.packages && Array.isArray(autoinstall.packages)) {
                            newConfig.packages = autoinstall.packages.join('\n');
                        }

                        if (autoinstall.snaps && Array.isArray(autoinstall.snaps)) {
                            newConfig.snaps = autoinstall.snaps.map(s => jsyaml.dump(s).trim()).join('\n---\n');
                        }

                        if (autoinstall.kernel) {
                            const kernelValue = typeof autoinstall.kernel === 'string' ?
                                autoinstall.kernel : autoinstall.kernel.package;
                            if (kernelValue) newConfig.kernel = kernelValue;
                        }

                        if (autoinstall.drivers && autoinstall.drivers.install) newConfig.drivers = true;
                        if (autoinstall.codecs && autoinstall.codecs.install) newConfig.codecs = true;

                        if (autoinstall.ssh) {
                            newConfig.sshInstallServer = autoinstall.ssh['install-server'] !== false;
                            newConfig.sshAllowPw = autoinstall.ssh['allow-pw'] !== false;
                            if (autoinstall.ssh['authorized-keys'] && Array.isArray(autoinstall.ssh['authorized-keys'])) {
                                newConfig.sshAuthorizedKeys = autoinstall.ssh['authorized-keys'].join('\n');
                            }
                        }

                        if (autoinstall['early-commands'] && Array.isArray(autoinstall['early-commands'])) {
                            newConfig.earlyCommands = autoinstall['early-commands'].join('\n');
                        }
                        if (autoinstall['late-commands'] && Array.isArray(autoinstall['late-commands'])) {
                            newConfig.lateCommands = autoinstall['late-commands'].join('\n');
                        }
                        if (autoinstall['error-commands'] && Array.isArray(autoinstall['error-commands'])) {
                            newConfig.errorCommands = autoinstall['error-commands'].join('\n');
                        }

                        if (autoinstall['user-data']) {
                            newConfig.userData = typeof autoinstall['user-data'] === 'string' ?
                                autoinstall['user-data'] : jsyaml.dump(autoinstall['user-data']);
                        }

                        if (autoinstall.shutdown) newConfig.shutdown = autoinstall.shutdown;
                        if (autoinstall['kernel-crash-dumps'] && autoinstall['kernel-crash-dumps'].enabled) {
                            newConfig.kernelCrashDumps = true;
                        }
                        if (autoinstall['ubuntu-pro'] && autoinstall['ubuntu-pro'].token) {
                            newConfig.ubuntuProToken = autoinstall['ubuntu-pro'].token;
                        }

                        setConfig(newConfig);
                        alert('YAML file loaded successfully!');
                        announce('YAML file loaded successfully');
                    } catch (err) {
                        console.error('Error loading YAML:', err);
                        alert('Error loading YAML file: ' + err.message);
                        announce('Error loading YAML file');
                    }
                };
                reader.readAsText(file);
            };

            const saveToURL = () => {
                const compressed = btoa(JSON.stringify(config));
                window.location.hash = compressed;
                alert('Configuration saved to URL! You can now bookmark this page.');
                announce('Configuration saved to URL');
            };

            const clearForm = () => {
                if (confirm('Are you sure you want to clear all fields?')) {
                    setConfig({
                        version: 1,
                        locale: '',
                        timezone: '',
                        keyboardLayout: '',
                        keyboardVariant: '',
                        updates: '',
                        hostname: '',
                        username: '',
                        password: '',
                        realname: '',
                        networkConfig: '',
                        proxy: '',
                        storageConfig: '',
                        packages: '',
                        snaps: '',
                        kernel: '',
                        drivers: false,
                        codecs: false,
                        sshInstallServer: true,
                        sshAllowPw: true,
                        sshAuthorizedKeys: '',
                        earlyCommands: '',
                        lateCommands: '',
                        errorCommands: '',
                        userData: '',
                        shutdown: '',
                        kernelCrashDumps: false,
                        ubuntuProToken: ''
                    });
                    window.location.hash = '';
                    announce('Form cleared');
                }
            };

            const handleTabKeyDown = (e, index) => {
                let newIndex = index;

                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    newIndex = (index + 1) % tabs.length;
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    newIndex = (index - 1 + tabs.length) % tabs.length;
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    newIndex = 0;
                } else if (e.key === 'End') {
                    e.preventDefault();
                    newIndex = tabs.length - 1;
                } else {
                    return;
                }

                setActiveTab(tabs[newIndex].id);
                announce(`Switched to ${tabs[newIndex].label} tab`);
            };

            const ActiveTabComponent = tabs.find(t => t.id === activeTab)?.component || BasicTab;

            return (
                <div className={`${darkMode ? 'dark' : ''} min-h-screen`}>
                    <div className="bg-gradient-to-br from-purple-600 via-purple-700 to-pink-600 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 min-h-screen p-4 md:p-6">
                        {/* Skip to main content link */}
                        <a href="#main-content" className="skip-link">Skip to main content</a>

                        {/* Screen reader announcements */}
                        <ScreenReaderAnnouncement message={announcement} />

                        <div className="max-w-7xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-2xl overflow-hidden">
                            {/* Header */}
                            <header className="bg-gradient-to-r from-ubuntu-orange to-ubuntu-purple text-white py-8 px-6 md:px-10 relative" role="banner">
                                <div className="absolute top-4 right-4 flex gap-2">
                                    <select
                                        value={language}
                                        onChange={(e) => handleLanguageChange(e.target.value)}
                                        className="px-3 py-2 rounded-lg bg-white/20 hover:bg-white/30 transition-colors text-white font-semibold cursor-pointer border-none"
                                        aria-label="Select language"
                                    >
                                        {window.i18n.getAvailableLanguages().map(lang => (
                                            <option key={lang.code} value={lang.code} className="bg-gray-800">
                                                {lang.flag} {lang.name}
                                            </option>
                                        ))}
                                    </select>
                                    <button
                                        onClick={() => setDarkMode(!darkMode)}
                                        className="p-2 rounded-lg bg-white/20 hover:bg-white/30 transition-colors"
                                        aria-label={darkMode ? window.i18n.t('lightMode') : window.i18n.t('darkMode')}
                                        title={darkMode ? window.i18n.t('lightMode') : window.i18n.t('darkMode')}
                                    >
                                        {darkMode ? '☀️' : '🌙'}
                                    </button>
                                </div>
                                <h1 className="text-3xl md:text-4xl font-bold mb-2 text-center pr-32">
                                    {window.i18n.t('appTitle')}
                                </h1>
                                <p className="text-lg md:text-xl text-center opacity-90 pr-32">
                                    {window.i18n.t('appSubtitle')}
                                </p>
                            </header>

                            {/* Template and Actions Bar */}
                            <div className="bg-gray-100 dark:bg-gray-700 p-4 flex flex-wrap gap-2 justify-center border-b border-gray-200 dark:border-gray-600">
                                <button
                                    onClick={() => setShowTemplates(true)}
                                    className="px-3 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors text-sm"
                                >
                                    📋 {window.i18n.t('loadTemplate')}
                                </button>
                                <button
                                    onClick={handleValidate}
                                    className="px-3 py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-colors text-sm"
                                    title={window.i18n.t('validateConfig')}
                                >
                                    ✅ {window.i18n.t('validateConfig')}
                                </button>
                                <button
                                    onClick={() => setShowDiff(true)}
                                    className="px-3 py-2 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700 transition-colors text-sm"
                                    title={window.i18n.t('compareConfigs')}
                                >
                                    📊 {window.i18n.t('compareConfigs')}
                                </button>
                                <button
                                    onClick={() => setShowConfigSimulator(true)}
                                    className="px-3 py-2 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition-colors text-sm"
                                    title={window.i18n.t('previewSystem')}
                                >
                                    🔍 {window.i18n.t('previewSystem')}
                                </button>
                                <button
                                    onClick={() => setShowCloudInitExport(true)}
                                    className="px-3 py-2 bg-cyan-600 text-white rounded-lg font-semibold hover:bg-cyan-700 transition-colors text-sm"
                                    title={window.i18n.t('exportCloudInit')}
                                >
                                    ☁️ {window.i18n.t('exportCloudInit')}
                                </button>
                                <button
                                    onClick={() => setShowSystemImporter(true)}
                                    className="px-3 py-2 bg-teal-600 text-white rounded-lg font-semibold hover:bg-teal-700 transition-colors text-sm"
                                    title={window.i18n.t('importSystem')}
                                >
                                    📥 {window.i18n.t('importSystem')}
                                </button>
                            </div>

                            {/* Main Content */}
                            <main id="main-content" role="main">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-0 min-h-[600px]">
                                    {/* Form Section */}
                                    <section
                                        className="p-6 md:p-8 overflow-y-auto max-h-[calc(100vh-300px)] lg:border-r border-gray-200 dark:border-gray-700"
                                        aria-label="Configuration Form"
                                    >
                                        {/* Tabs Navigation */}
                                        <nav role="tablist" aria-label="Configuration sections" className="flex flex-wrap border-b-2 border-gray-200 dark:border-gray-700 mb-6">
                                            {tabs.map((tab, index) => (
                                                <button
                                                    key={tab.id}
                                                    role="tab"
                                                    aria-selected={activeTab === tab.id}
                                                    aria-controls={`${tab.id}-panel`}
                                                    id={`${tab.id}-tab`}
                                                    className={`px-4 py-3 text-sm font-medium transition-colors border-b-3 focus:outline-none focus:ring-2 focus:ring-ubuntu-orange ${
                                                        activeTab === tab.id
                                                            ? 'text-ubuntu-orange border-b-4 border-ubuntu-orange font-semibold'
                                                            : 'text-gray-600 dark:text-gray-400 hover:text-ubuntu-orange border-transparent'
                                                    }`}
                                                    onClick={() => {
                                                        setActiveTab(tab.id);
                                                        announce(`Switched to ${tab.label} tab`);
                                                    }}
                                                    onKeyDown={(e) => handleTabKeyDown(e, index)}
                                                    tabIndex={activeTab === tab.id ? 0 : -1}
                                                >
                                                    {tab.label}
                                                </button>
                                            ))}
                                        </nav>

                                        {/* Tab Content */}
                                        <ActiveTabComponent
                                            config={config}
                                            updateConfig={updateConfig}
                                            darkMode={darkMode}
                                            onShowPasswordHash={() => setShowPasswordHash(true)}
                                            onShowStorageWizard={() => setShowStorageWizard(true)}
                                            onShowNetworkWizard={() => setShowNetworkWizard(true)}
                                        />
                                    </section>

                                    {/* Preview Section */}
                                    <section
                                        className="p-6 md:p-8 bg-gray-50 dark:bg-gray-900 overflow-y-auto max-h-[calc(100vh-300px)]"
                                        aria-label="YAML Preview"
                                    >
                                        <h2 className="text-2xl font-semibold text-ubuntu-orange mb-6 pb-3 border-b-2 border-gray-200 dark:border-gray-700">
                                            YAML Preview
                                        </h2>
                                        <div
                                            role="region"
                                            aria-live="polite"
                                            aria-label="Generated YAML output"
                                            className="bg-gray-900 dark:bg-black text-gray-100 p-5 rounded-lg font-mono text-sm leading-relaxed whitespace-pre-wrap break-words max-h-[500px] overflow-y-auto"
                                        >
                                            {yaml}
                                        </div>
                                    </section>
                                </div>
                            </main>

                            {/* Action Buttons */}
                            <footer className="p-6 bg-gray-50 dark:bg-gray-700 border-t-2 border-gray-200 dark:border-gray-600" role="contentinfo">
                                <div className="flex flex-wrap gap-3 justify-center">
                                    <button
                                        onClick={generateYAML}
                                        className="px-5 py-2.5 bg-ubuntu-orange text-white rounded-lg font-semibold hover:bg-ubuntu-orange/90 focus:ring-4 focus:ring-ubuntu-orange/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
                                        aria-label="Generate YAML configuration"
                                    >
                                        Generate YAML
                                    </button>
                                    <button
                                        onClick={downloadYAML}
                                        className="px-5 py-2.5 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 focus:ring-4 focus:ring-green-500/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
                                        aria-label="Download autoinstall.yaml file"
                                    >
                                        Download autoinstall.yaml
                                    </button>
                                    <button
                                        onClick={copyToClipboard}
                                        className="px-5 py-2.5 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 focus:ring-4 focus:ring-gray-500/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
                                        aria-label="Copy YAML to clipboard"
                                    >
                                        Copy to Clipboard
                                    </button>
                                    <label
                                        htmlFor="file-input"
                                        className="px-5 py-2.5 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 focus:ring-4 focus:ring-gray-500/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg cursor-pointer inline-block"
                                        tabIndex={0}
                                        role="button"
                                        aria-label="Load YAML file from disk"
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter' || e.key === ' ') {
                                                e.preventDefault();
                                                fileInputRef.current?.click();
                                            }
                                        }}
                                    >
                                        Load YAML File
                                    </label>
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        id="file-input"
                                        accept=".yaml,.yml"
                                        onChange={loadYAMLFile}
                                        className="sr-only"
                                        aria-label="Choose YAML file to load"
                                    />
                                    <button
                                        onClick={saveToURL}
                                        className="px-5 py-2.5 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 focus:ring-4 focus:ring-gray-500/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
                                        aria-label="Save configuration to URL for bookmarking"
                                    >
                                        Save to Bookmark
                                    </button>
                                    <button
                                        onClick={clearForm}
                                        className="px-5 py-2.5 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 focus:ring-4 focus:ring-gray-500/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
                                        aria-label="Clear all form fields"
                                    >
                                        Clear Form
                                    </button>
                                </div>
                            </footer>
                        </div>

                        {/* Modals */}
                        <PasswordHashModal
                            isOpen={showPasswordHash}
                            onClose={() => setShowPasswordHash(false)}
                            onUseHash={(hash) => updateConfig('password', hash)}
                        />
                        <TemplatesModal
                            isOpen={showTemplates}
                            onClose={() => setShowTemplates(false)}
                            onSelectTemplate={applyTemplate}
                        />
                        {window.ValidationModal && (
                            <window.ValidationModal
                                isOpen={showValidation}
                                onClose={() => setShowValidation(false)}
                                results={validationResults}
                            />
                        )}
                        {window.DiffModal && (
                            <window.DiffModal
                                isOpen={showDiff}
                                onClose={() => setShowDiff(false)}
                            />
                        )}
                        {window.StorageWizard && (
                            <window.StorageWizard
                                isOpen={showStorageWizard}
                                onClose={() => setShowStorageWizard(false)}
                                onApply={handleStorageWizardApply}
                            />
                        )}
                        {window.NetworkWizard && (
                            <window.NetworkWizard
                                isOpen={showNetworkWizard}
                                onClose={() => setShowNetworkWizard(false)}
                                onApply={handleNetworkWizardApply}
                            />
                        )}
                        {window.CloudInitExportModal && (
                            <window.CloudInitExportModal
                                isOpen={showCloudInitExport}
                                onClose={() => setShowCloudInitExport(false)}
                                autoinstallYaml={yaml}
                            />
                        )}
                        {window.ConfigSimulatorModal && (
                            <window.ConfigSimulatorModal
                                isOpen={showConfigSimulator}
                                onClose={() => setShowConfigSimulator(false)}
                                autoinstallYaml={yaml}
                            />
                        )}
                        {window.SystemImporterWizard && (
                            <window.SystemImporterWizard
                                isOpen={showSystemImporter}
                                onClose={() => setShowSystemImporter(false)}
                                onApply={handleSystemImporterApply}
                            />
                        )}
                    </div>
                </div>
            );
        };

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
