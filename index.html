<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Accessible web-based GUI for creating Ubuntu autoinstall configurations with YAML generation, save/load functionality, and bookmark support.">
    <title>Ubuntu Autoinstall Configuration Builder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- YAML Parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ubuntu-orange': '#E95420',
                        'ubuntu-purple': '#772953',
                        'ubuntu-dark': '#2C001E',
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Enhanced focus styles for accessibility */
        *:focus {
            outline: 3px solid #E95420;
            outline-offset: 2px;
        }

        /* Skip to main content link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #E95420;
            color: white;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }

        .skip-link:focus {
            top: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Screen Reader Announcement Component
        const ScreenReaderAnnouncement = ({ message }) => {
            return (
                <div
                    aria-live="polite"
                    aria-atomic="true"
                    className="sr-only"
                >
                    {message}
                </div>
            );
        };

        // Form Input Component
        const FormInput = ({ label, id, type = "text", value, onChange, placeholder, helpText, required = false, ...props }) => {
            return (
                <div className="mb-5">
                    <label htmlFor={id} className="block text-sm font-semibold text-gray-700 mb-2">
                        {label} {required && <span className="text-red-600" aria-label="required">*</span>}
                    </label>
                    <input
                        type={type}
                        id={id}
                        name={id}
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        placeholder={placeholder}
                        required={required}
                        aria-required={required}
                        aria-describedby={`${id}-help`}
                        className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-ubuntu-orange focus:ring-2 focus:ring-ubuntu-orange/20 transition-colors"
                        {...props}
                    />
                    {helpText && (
                        <p id={`${id}-help`} className="mt-1 text-sm text-gray-600">
                            {helpText}
                        </p>
                    )}
                </div>
            );
        };

        // Textarea Component
        const FormTextarea = ({ label, id, value, onChange, placeholder, helpText, rows = 6, ...props }) => {
            return (
                <div className="mb-5">
                    <label htmlFor={id} className="block text-sm font-semibold text-gray-700 mb-2">
                        {label}
                    </label>
                    <textarea
                        id={id}
                        name={id}
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        placeholder={placeholder}
                        rows={rows}
                        aria-describedby={`${id}-help`}
                        className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-ubuntu-orange focus:ring-2 focus:ring-ubuntu-orange/20 transition-colors font-mono text-sm"
                        {...props}
                    />
                    {helpText && (
                        <p id={`${id}-help`} className="mt-1 text-sm text-gray-600">
                            {helpText}
                        </p>
                    )}
                </div>
            );
        };

        // Select Component
        const FormSelect = ({ label, id, value, onChange, options, helpText, ...props }) => {
            return (
                <div className="mb-5">
                    <label htmlFor={id} className="block text-sm font-semibold text-gray-700 mb-2">
                        {label}
                    </label>
                    <select
                        id={id}
                        name={id}
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        aria-describedby={`${id}-help`}
                        className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-ubuntu-orange focus:ring-2 focus:ring-ubuntu-orange/20 transition-colors"
                        {...props}
                    >
                        {options.map(opt => (
                            <option key={opt.value} value={opt.value}>{opt.label}</option>
                        ))}
                    </select>
                    {helpText && (
                        <p id={`${id}-help`} className="mt-1 text-sm text-gray-600">
                            {helpText}
                        </p>
                    )}
                </div>
            );
        };

        // Checkbox Component
        const FormCheckbox = ({ label, id, checked, onChange, helpText, ...props }) => {
            return (
                <div className="mb-5">
                    <div className="flex items-center gap-3">
                        <input
                            type="checkbox"
                            id={id}
                            name={id}
                            checked={checked}
                            onChange={(e) => onChange(e.target.checked)}
                            aria-describedby={`${id}-help`}
                            className="w-5 h-5 text-ubuntu-orange border-gray-300 rounded focus:ring-ubuntu-orange focus:ring-2"
                            {...props}
                        />
                        <label htmlFor={id} className="text-sm font-semibold text-gray-700 cursor-pointer">
                            {label}
                        </label>
                    </div>
                    {helpText && (
                        <p id={`${id}-help`} className="mt-1 ml-8 text-sm text-gray-600">
                            {helpText}
                        </p>
                    )}
                </div>
            );
        };

        // Info Box Component
        const InfoBox = ({ children }) => {
            return (
                <div role="note" className="bg-blue-50 border-l-4 border-blue-400 p-4 mb-6 rounded">
                    <p className="text-sm text-blue-900">
                        {children}
                    </p>
                </div>
            );
        };

        // Tab Panel Components
        const BasicTab = ({ config, updateConfig }) => (
            <div role="tabpanel" id="basic-panel" aria-labelledby="basic-tab" className="fade-in">
                <h2 className="text-2xl font-semibold text-ubuntu-orange mb-6 pb-3 border-b-2 border-gray-200">
                    Basic Configuration
                </h2>

                <FormInput
                    label="Version"
                    id="version"
                    type="number"
                    value={config.version}
                    onChange={(val) => updateConfig('version', parseInt(val) || 1)}
                    required
                    helpText="Autoinstall schema version (must be 1)"
                />

                <FormInput
                    label="Locale"
                    id="locale"
                    value={config.locale}
                    onChange={(val) => updateConfig('locale', val)}
                    placeholder="en_US.UTF-8"
                    helpText="System language and region"
                />

                <FormInput
                    label="Timezone"
                    id="timezone"
                    value={config.timezone}
                    onChange={(val) => updateConfig('timezone', val)}
                    placeholder="America/New_York"
                    helpText="System timezone (e.g., America/New_York, Europe/London)"
                />

                <FormInput
                    label="Keyboard Layout"
                    id="keyboard-layout"
                    value={config.keyboardLayout}
                    onChange={(val) => updateConfig('keyboardLayout', val)}
                    placeholder="us"
                    helpText="Keyboard layout (e.g., us, uk, de)"
                />

                <FormInput
                    label="Keyboard Variant"
                    id="keyboard-variant"
                    value={config.keyboardVariant}
                    onChange={(val) => updateConfig('keyboardVariant', val)}
                    placeholder="Optional variant"
                    helpText="Optional keyboard variant"
                />

                <FormSelect
                    label="Updates"
                    id="updates"
                    value={config.updates}
                    onChange={(val) => updateConfig('updates', val)}
                    options={[
                        { value: '', label: 'No automatic updates' },
                        { value: 'security', label: 'Security updates only' },
                        { value: 'all', label: 'All updates' }
                    ]}
                    helpText="Update policy during installation"
                />
            </div>
        );

        const IdentityTab = ({ config, updateConfig }) => (
            <div role="tabpanel" id="identity-panel" aria-labelledby="identity-tab" className="fade-in">
                <h2 className="text-2xl font-semibold text-ubuntu-orange mb-6 pb-3 border-b-2 border-gray-200">
                    User Identity
                </h2>

                <FormInput
                    label="Hostname"
                    id="identity-hostname"
                    value={config.hostname}
                    onChange={(val) => updateConfig('hostname', val)}
                    placeholder="ubuntu-server"
                    helpText="System hostname"
                />

                <FormInput
                    label="Username"
                    id="identity-username"
                    value={config.username}
                    onChange={(val) => updateConfig('username', val)}
                    placeholder="ubuntu"
                    autoComplete="username"
                    helpText="Primary user account name"
                />

                <FormInput
                    label="Password"
                    id="identity-password"
                    type="password"
                    value={config.password}
                    onChange={(val) => updateConfig('password', val)}
                    placeholder="Enter password"
                    autoComplete="new-password"
                    helpText="User password (will be stored as plain text in YAML - hash it before deployment)"
                />

                <FormInput
                    label="Real Name"
                    id="identity-realname"
                    value={config.realname}
                    onChange={(val) => updateConfig('realname', val)}
                    placeholder="Ubuntu User"
                    autoComplete="name"
                    helpText="User's full name"
                />
            </div>
        );

        const NetworkTab = ({ config, updateConfig }) => (
            <div role="tabpanel" id="network-panel" aria-labelledby="network-tab" className="fade-in">
                <h2 className="text-2xl font-semibold text-ubuntu-orange mb-6 pb-3 border-b-2 border-gray-200">
                    Network Configuration
                </h2>

                <InfoBox>
                    Network configuration uses Netplan format. Leave empty for DHCP on all interfaces.
                </InfoBox>

                <FormTextarea
                    label="Network Configuration (YAML)"
                    id="network-config"
                    value={config.networkConfig}
                    onChange={(val) => updateConfig('networkConfig', val)}
                    placeholder="version: 2&#10;ethernets:&#10;  eth0:&#10;    dhcp4: true"
                    rows={10}
                    helpText="Netplan v2 configuration in YAML format"
                />

                <FormInput
                    label="HTTP Proxy"
                    id="proxy"
                    value={config.proxy}
                    onChange={(val) => updateConfig('proxy', val)}
                    placeholder="http://proxy.example.com:3128"
                    helpText="HTTP proxy URI (optional)"
                />
            </div>
        );

        const StorageTab = ({ config, updateConfig }) => (
            <div role="tabpanel" id="storage-panel" aria-labelledby="storage-tab" className="fade-in">
                <h2 className="text-2xl font-semibold text-ubuntu-orange mb-6 pb-3 border-b-2 border-gray-200">
                    Storage Configuration
                </h2>

                <InfoBox>
                    Storage configuration defines disk partitioning. Leave empty for default guided partitioning.
                </InfoBox>

                <FormTextarea
                    label="Storage Configuration (YAML)"
                    id="storage-config"
                    value={config.storageConfig}
                    onChange={(val) => updateConfig('storageConfig', val)}
                    placeholder="layout:&#10;  name: lvm"
                    rows={15}
                    helpText="Storage layout configuration in YAML format"
                />
            </div>
        );

        const SoftwareTab = ({ config, updateConfig }) => (
            <div role="tabpanel" id="software-panel" aria-labelledby="software-tab" className="fade-in">
                <h2 className="text-2xl font-semibold text-ubuntu-orange mb-6 pb-3 border-b-2 border-gray-200">
                    Software Installation
                </h2>

                <FormTextarea
                    label="APT Packages"
                    id="packages"
                    value={config.packages}
                    onChange={(val) => updateConfig('packages', val)}
                    placeholder="curl&#10;wget&#10;git&#10;vim"
                    rows={6}
                    helpText="Package names (one per line)"
                />

                <FormTextarea
                    label="Snap Packages"
                    id="snaps"
                    value={config.snaps}
                    onChange={(val) => updateConfig('snaps', val)}
                    placeholder="name: lxd&#10;channel: latest/stable&#10;---&#10;name: docker&#10;classic: true"
                    rows={6}
                    helpText="Snap packages (YAML format, use --- to separate multiple snaps)"
                />

                <FormInput
                    label="Kernel Package"
                    id="kernel"
                    value={config.kernel}
                    onChange={(val) => updateConfig('kernel', val)}
                    placeholder="linux-generic-hwe-22.04"
                    helpText="Kernel package or flavor (optional)"
                />

                <FormCheckbox
                    label="Install proprietary drivers"
                    id="drivers"
                    checked={config.drivers}
                    onChange={(val) => updateConfig('drivers', val)}
                    helpText="Automatically install proprietary hardware drivers"
                />

                <FormCheckbox
                    label="Install restricted codecs"
                    id="codecs"
                    checked={config.codecs}
                    onChange={(val) => updateConfig('codecs', val)}
                    helpText="Install media codecs and plugins"
                />
            </div>
        );

        const SSHTab = ({ config, updateConfig }) => (
            <div role="tabpanel" id="ssh-panel" aria-labelledby="ssh-tab" className="fade-in">
                <h2 className="text-2xl font-semibold text-ubuntu-orange mb-6 pb-3 border-b-2 border-gray-200">
                    SSH Configuration
                </h2>

                <FormCheckbox
                    label="Install OpenSSH server"
                    id="ssh-install-server"
                    checked={config.sshInstallServer}
                    onChange={(val) => updateConfig('sshInstallServer', val)}
                    helpText="Install and configure OpenSSH server"
                />

                <FormCheckbox
                    label="Allow password authentication"
                    id="ssh-allow-pw"
                    checked={config.sshAllowPw}
                    onChange={(val) => updateConfig('sshAllowPw', val)}
                    helpText="Permit SSH login with password"
                />

                <FormTextarea
                    label="Authorized SSH Keys"
                    id="ssh-authorized-keys"
                    value={config.sshAuthorizedKeys}
                    onChange={(val) => updateConfig('sshAuthorizedKeys', val)}
                    placeholder="ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQ..."
                    rows={4}
                    helpText="SSH public keys (one per line)"
                />
            </div>
        );

        const AdvancedTab = ({ config, updateConfig }) => (
            <div role="tabpanel" id="advanced-panel" aria-labelledby="advanced-tab" className="fade-in">
                <h2 className="text-2xl font-semibold text-ubuntu-orange mb-6 pb-3 border-b-2 border-gray-200">
                    Advanced Options
                </h2>

                <FormTextarea
                    label="Early Commands"
                    id="early-commands"
                    value={config.earlyCommands}
                    onChange={(val) => updateConfig('earlyCommands', val)}
                    placeholder="echo 'Early command 1'&#10;echo 'Early command 2'"
                    rows={4}
                    helpText="Commands to run before installation (one per line)"
                />

                <FormTextarea
                    label="Late Commands"
                    id="late-commands"
                    value={config.lateCommands}
                    onChange={(val) => updateConfig('lateCommands', val)}
                    placeholder="echo 'Late command 1'&#10;curtin in-target -- apt update"
                    rows={4}
                    helpText="Commands to run after installation (one per line)"
                />

                <FormTextarea
                    label="Error Commands"
                    id="error-commands"
                    value={config.errorCommands}
                    onChange={(val) => updateConfig('errorCommands', val)}
                    placeholder="echo 'Installation failed' > /var/log/install-error.log"
                    rows={4}
                    helpText="Commands to run on installation error (one per line)"
                />

                <FormTextarea
                    label="Cloud-init User Data"
                    id="user-data"
                    value={config.userData}
                    onChange={(val) => updateConfig('userData', val)}
                    placeholder="#cloud-config&#10;runcmd:&#10;  - echo 'Hello World'"
                    rows={6}
                    helpText="Cloud-init user-data configuration"
                />

                <FormSelect
                    label="Shutdown Action"
                    id="shutdown"
                    value={config.shutdown}
                    onChange={(val) => updateConfig('shutdown', val)}
                    options={[
                        { value: '', label: 'Default (reboot)' },
                        { value: 'reboot', label: 'Reboot' },
                        { value: 'poweroff', label: 'Power off' }
                    ]}
                    helpText="Action to take after installation completes"
                />

                <FormCheckbox
                    label="Enable kernel crash dumps"
                    id="kernel-crash-dumps"
                    checked={config.kernelCrashDumps}
                    onChange={(val) => updateConfig('kernelCrashDumps', val)}
                    helpText="Enable kdump for kernel crash analysis"
                />

                <FormInput
                    label="Ubuntu Pro Token"
                    id="ubuntu-pro-token"
                    value={config.ubuntuProToken}
                    onChange={(val) => updateConfig('ubuntuProToken', val)}
                    placeholder="C..."
                    helpText="Ubuntu Pro subscription token (Base58, starts with 'C')"
                />
            </div>
        );

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState('basic');
            const [announcement, setAnnouncement] = useState('');
            const [yaml, setYaml] = useState('# Configure options and the YAML will be generated automatically');
            const fileInputRef = useRef(null);

            const [config, setConfig] = useState({
                version: 1,
                locale: '',
                timezone: '',
                keyboardLayout: '',
                keyboardVariant: '',
                updates: '',
                hostname: '',
                username: '',
                password: '',
                realname: '',
                networkConfig: '',
                proxy: '',
                storageConfig: '',
                packages: '',
                snaps: '',
                kernel: '',
                drivers: false,
                codecs: false,
                sshInstallServer: true,
                sshAllowPw: true,
                sshAuthorizedKeys: '',
                earlyCommands: '',
                lateCommands: '',
                errorCommands: '',
                userData: '',
                shutdown: '',
                kernelCrashDumps: false,
                ubuntuProToken: ''
            });

            const tabs = [
                { id: 'basic', label: 'Basic', component: BasicTab },
                { id: 'identity', label: 'Identity', component: IdentityTab },
                { id: 'network', label: 'Network', component: NetworkTab },
                { id: 'storage', label: 'Storage', component: StorageTab },
                { id: 'software', label: 'Software', component: SoftwareTab },
                { id: 'ssh', label: 'SSH', component: SSHTab },
                { id: 'advanced', label: 'Advanced', component: AdvancedTab }
            ];

            const updateConfig = useCallback((key, value) => {
                setConfig(prev => ({ ...prev, [key]: value }));
            }, []);

            const announce = useCallback((message) => {
                setAnnouncement(message);
                setTimeout(() => setAnnouncement(''), 1000);
            }, []);

            const generateYAML = useCallback(() => {
                const autoinstallConfig = {
                    autoinstall: {}
                };

                // Version
                if (config.version) {
                    autoinstallConfig.autoinstall.version = config.version;
                }

                // Basic
                if (config.locale) autoinstallConfig.autoinstall.locale = config.locale;
                if (config.timezone) autoinstallConfig.autoinstall.timezone = config.timezone;
                if (config.updates) autoinstallConfig.autoinstall.updates = config.updates;

                // Keyboard
                if (config.keyboardLayout) {
                    autoinstallConfig.autoinstall.keyboard = { layout: config.keyboardLayout };
                    if (config.keyboardVariant) {
                        autoinstallConfig.autoinstall.keyboard.variant = config.keyboardVariant;
                    }
                }

                // Identity
                if (config.hostname || config.username || config.password) {
                    autoinstallConfig.autoinstall.identity = {};
                    if (config.hostname) autoinstallConfig.autoinstall.identity.hostname = config.hostname;
                    if (config.username) autoinstallConfig.autoinstall.identity.username = config.username;
                    if (config.password) autoinstallConfig.autoinstall.identity.password = config.password;
                    if (config.realname) autoinstallConfig.autoinstall.identity.realname = config.realname;
                }

                // Network
                if (config.networkConfig) {
                    try {
                        autoinstallConfig.autoinstall.network = jsyaml.load(config.networkConfig);
                    } catch (e) {
                        console.error('Invalid network YAML:', e);
                        announce('Error: Invalid network YAML configuration');
                    }
                }
                if (config.proxy) autoinstallConfig.autoinstall.proxy = config.proxy;

                // Storage
                if (config.storageConfig) {
                    try {
                        autoinstallConfig.autoinstall.storage = jsyaml.load(config.storageConfig);
                    } catch (e) {
                        console.error('Invalid storage YAML:', e);
                        announce('Error: Invalid storage YAML configuration');
                    }
                }

                // Packages
                if (config.packages) {
                    autoinstallConfig.autoinstall.packages = config.packages.split('\n').filter(p => p.trim());
                }

                // Snaps
                if (config.snaps) {
                    const snapBlocks = config.snaps.split('---').map(s => s.trim()).filter(s => s);
                    autoinstallConfig.autoinstall.snaps = snapBlocks.map(block => {
                        try {
                            return jsyaml.load(block);
                        } catch (e) {
                            return {};
                        }
                    });
                }

                // Kernel
                if (config.kernel) autoinstallConfig.autoinstall.kernel = { package: config.kernel };

                // Drivers and codecs
                if (config.drivers) autoinstallConfig.autoinstall.drivers = { install: true };
                if (config.codecs) autoinstallConfig.autoinstall.codecs = { install: true };

                // SSH
                if (config.sshInstallServer || config.sshAuthorizedKeys) {
                    autoinstallConfig.autoinstall.ssh = {
                        'install-server': config.sshInstallServer,
                        'allow-pw': config.sshAllowPw
                    };
                    if (config.sshAuthorizedKeys) {
                        autoinstallConfig.autoinstall.ssh['authorized-keys'] =
                            config.sshAuthorizedKeys.split('\n').filter(k => k.trim());
                    }
                }

                // Advanced
                if (config.earlyCommands) {
                    autoinstallConfig.autoinstall['early-commands'] =
                        config.earlyCommands.split('\n').filter(c => c.trim());
                }
                if (config.lateCommands) {
                    autoinstallConfig.autoinstall['late-commands'] =
                        config.lateCommands.split('\n').filter(c => c.trim());
                }
                if (config.errorCommands) {
                    autoinstallConfig.autoinstall['error-commands'] =
                        config.errorCommands.split('\n').filter(c => c.trim());
                }
                if (config.userData) autoinstallConfig.autoinstall['user-data'] = config.userData;
                if (config.shutdown) autoinstallConfig.autoinstall.shutdown = config.shutdown;
                if (config.kernelCrashDumps) {
                    autoinstallConfig.autoinstall['kernel-crash-dumps'] = { enabled: true };
                }
                if (config.ubuntuProToken) {
                    autoinstallConfig.autoinstall['ubuntu-pro'] = { token: config.ubuntuProToken };
                }

                const yamlOutput = jsyaml.dump(autoinstallConfig, {
                    indent: 2,
                    lineWidth: -1,
                    noRefs: true
                });

                setYaml(yamlOutput);
                announce('YAML configuration generated');
                return yamlOutput;
            }, [config, announce]);

            // Auto-generate YAML when config changes
            useEffect(() => {
                generateYAML();
            }, [config, generateYAML]);

            // Load from URL on mount
            useEffect(() => {
                const loadFromURL = () => {
                    const hash = window.location.hash.substring(1);
                    if (hash) {
                        try {
                            const formData = JSON.parse(atob(hash));
                            setConfig(formData);
                            announce('Configuration loaded from URL');
                        } catch (e) {
                            console.error('Failed to load from URL:', e);
                        }
                    }
                };

                loadFromURL();

                const handleHashChange = () => loadFromURL();
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [announce]);

            const downloadYAML = () => {
                const yamlContent = generateYAML();
                const blob = new Blob([yamlContent], { type: 'text/yaml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'autoinstall.yaml';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                announce('YAML file downloaded');
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(yaml).then(() => {
                    alert('YAML copied to clipboard!');
                    announce('YAML copied to clipboard');
                }).catch(err => {
                    console.error('Failed to copy:', err);
                    alert('Failed to copy to clipboard');
                    announce('Failed to copy to clipboard');
                });
            };

            const loadYAMLFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const content = e.target.result;
                        const data = jsyaml.load(content);
                        const autoinstall = data.autoinstall || data;

                        // Parse and set config from loaded YAML
                        const newConfig = { ...config };

                        if (autoinstall.version !== undefined) newConfig.version = autoinstall.version;
                        if (autoinstall.locale) newConfig.locale = autoinstall.locale;
                        if (autoinstall.timezone) newConfig.timezone = autoinstall.timezone;
                        if (autoinstall.updates) newConfig.updates = autoinstall.updates;

                        if (autoinstall.keyboard) {
                            if (autoinstall.keyboard.layout) newConfig.keyboardLayout = autoinstall.keyboard.layout;
                            if (autoinstall.keyboard.variant) newConfig.keyboardVariant = autoinstall.keyboard.variant;
                        }

                        if (autoinstall.identity) {
                            if (autoinstall.identity.hostname) newConfig.hostname = autoinstall.identity.hostname;
                            if (autoinstall.identity.username) newConfig.username = autoinstall.identity.username;
                            if (autoinstall.identity.password) newConfig.password = autoinstall.identity.password;
                            if (autoinstall.identity.realname) newConfig.realname = autoinstall.identity.realname;
                        }

                        if (autoinstall.network) {
                            newConfig.networkConfig = jsyaml.dump(autoinstall.network, { indent: 2 });
                        }
                        if (autoinstall.proxy) newConfig.proxy = autoinstall.proxy;

                        if (autoinstall.storage) {
                            newConfig.storageConfig = jsyaml.dump(autoinstall.storage, { indent: 2 });
                        }

                        if (autoinstall.packages && Array.isArray(autoinstall.packages)) {
                            newConfig.packages = autoinstall.packages.join('\n');
                        }

                        if (autoinstall.snaps && Array.isArray(autoinstall.snaps)) {
                            newConfig.snaps = autoinstall.snaps.map(s => jsyaml.dump(s).trim()).join('\n---\n');
                        }

                        if (autoinstall.kernel) {
                            const kernelValue = typeof autoinstall.kernel === 'string' ?
                                autoinstall.kernel : autoinstall.kernel.package;
                            if (kernelValue) newConfig.kernel = kernelValue;
                        }

                        if (autoinstall.drivers && autoinstall.drivers.install) newConfig.drivers = true;
                        if (autoinstall.codecs && autoinstall.codecs.install) newConfig.codecs = true;

                        if (autoinstall.ssh) {
                            newConfig.sshInstallServer = autoinstall.ssh['install-server'] !== false;
                            newConfig.sshAllowPw = autoinstall.ssh['allow-pw'] !== false;
                            if (autoinstall.ssh['authorized-keys'] && Array.isArray(autoinstall.ssh['authorized-keys'])) {
                                newConfig.sshAuthorizedKeys = autoinstall.ssh['authorized-keys'].join('\n');
                            }
                        }

                        if (autoinstall['early-commands'] && Array.isArray(autoinstall['early-commands'])) {
                            newConfig.earlyCommands = autoinstall['early-commands'].join('\n');
                        }
                        if (autoinstall['late-commands'] && Array.isArray(autoinstall['late-commands'])) {
                            newConfig.lateCommands = autoinstall['late-commands'].join('\n');
                        }
                        if (autoinstall['error-commands'] && Array.isArray(autoinstall['error-commands'])) {
                            newConfig.errorCommands = autoinstall['error-commands'].join('\n');
                        }

                        if (autoinstall['user-data']) {
                            newConfig.userData = typeof autoinstall['user-data'] === 'string' ?
                                autoinstall['user-data'] : jsyaml.dump(autoinstall['user-data']);
                        }

                        if (autoinstall.shutdown) newConfig.shutdown = autoinstall.shutdown;
                        if (autoinstall['kernel-crash-dumps'] && autoinstall['kernel-crash-dumps'].enabled) {
                            newConfig.kernelCrashDumps = true;
                        }
                        if (autoinstall['ubuntu-pro'] && autoinstall['ubuntu-pro'].token) {
                            newConfig.ubuntuProToken = autoinstall['ubuntu-pro'].token;
                        }

                        setConfig(newConfig);
                        alert('YAML file loaded successfully!');
                        announce('YAML file loaded successfully');
                    } catch (err) {
                        console.error('Error loading YAML:', err);
                        alert('Error loading YAML file: ' + err.message);
                        announce('Error loading YAML file');
                    }
                };
                reader.readAsText(file);
            };

            const saveToURL = () => {
                const compressed = btoa(JSON.stringify(config));
                window.location.hash = compressed;
                alert('Configuration saved to URL! You can now bookmark this page.');
                announce('Configuration saved to URL');
            };

            const clearForm = () => {
                if (confirm('Are you sure you want to clear all fields?')) {
                    setConfig({
                        version: 1,
                        locale: '',
                        timezone: '',
                        keyboardLayout: '',
                        keyboardVariant: '',
                        updates: '',
                        hostname: '',
                        username: '',
                        password: '',
                        realname: '',
                        networkConfig: '',
                        proxy: '',
                        storageConfig: '',
                        packages: '',
                        snaps: '',
                        kernel: '',
                        drivers: false,
                        codecs: false,
                        sshInstallServer: true,
                        sshAllowPw: true,
                        sshAuthorizedKeys: '',
                        earlyCommands: '',
                        lateCommands: '',
                        errorCommands: '',
                        userData: '',
                        shutdown: '',
                        kernelCrashDumps: false,
                        ubuntuProToken: ''
                    });
                    window.location.hash = '';
                    announce('Form cleared');
                }
            };

            const handleTabKeyDown = (e, index) => {
                let newIndex = index;

                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    newIndex = (index + 1) % tabs.length;
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    newIndex = (index - 1 + tabs.length) % tabs.length;
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    newIndex = 0;
                } else if (e.key === 'End') {
                    e.preventDefault();
                    newIndex = tabs.length - 1;
                } else {
                    return;
                }

                setActiveTab(tabs[newIndex].id);
                announce(`Switched to ${tabs[newIndex].label} tab`);
            };

            const ActiveTabComponent = tabs.find(t => t.id === activeTab)?.component || BasicTab;

            return (
                <div className="bg-gradient-to-br from-purple-600 via-purple-700 to-pink-600 min-h-screen p-4 md:p-6">
                    {/* Skip to main content link */}
                    <a href="#main-content" className="skip-link">Skip to main content</a>

                    {/* Screen reader announcements */}
                    <ScreenReaderAnnouncement message={announcement} />

                    <div className="max-w-7xl mx-auto bg-white rounded-xl shadow-2xl overflow-hidden">
                        {/* Header */}
                        <header className="bg-gradient-to-r from-ubuntu-orange to-ubuntu-purple text-white py-8 px-6 md:px-10" role="banner">
                            <h1 className="text-3xl md:text-4xl font-bold mb-2 text-center">
                                Ubuntu Autoinstall Configuration Builder
                            </h1>
                            <p className="text-lg md:text-xl text-center opacity-90">
                                Create and customize your Ubuntu autoinstall.yaml configuration
                            </p>
                        </header>

                        {/* Main Content */}
                        <main id="main-content" role="main">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-0 min-h-[600px]">
                                {/* Form Section */}
                                <section
                                    className="p-6 md:p-8 overflow-y-auto max-h-[calc(100vh-300px)] lg:border-r border-gray-200"
                                    aria-label="Configuration Form"
                                >
                                    {/* Tabs Navigation */}
                                    <nav role="tablist" aria-label="Configuration sections" className="flex flex-wrap border-b-2 border-gray-200 mb-6">
                                        {tabs.map((tab, index) => (
                                            <button
                                                key={tab.id}
                                                role="tab"
                                                aria-selected={activeTab === tab.id}
                                                aria-controls={`${tab.id}-panel`}
                                                id={`${tab.id}-tab`}
                                                className={`px-4 py-3 text-sm font-medium transition-colors border-b-3 focus:outline-none focus:ring-2 focus:ring-ubuntu-orange ${
                                                    activeTab === tab.id
                                                        ? 'text-ubuntu-orange border-b-4 border-ubuntu-orange font-semibold'
                                                        : 'text-gray-600 hover:text-ubuntu-orange border-transparent'
                                                }`}
                                                onClick={() => {
                                                    setActiveTab(tab.id);
                                                    announce(`Switched to ${tab.label} tab`);
                                                }}
                                                onKeyDown={(e) => handleTabKeyDown(e, index)}
                                                tabIndex={activeTab === tab.id ? 0 : -1}
                                            >
                                                {tab.label}
                                            </button>
                                        ))}
                                    </nav>

                                    {/* Tab Content */}
                                    <ActiveTabComponent config={config} updateConfig={updateConfig} />
                                </section>

                                {/* Preview Section */}
                                <section
                                    className="p-6 md:p-8 bg-gray-50 overflow-y-auto max-h-[calc(100vh-300px)]"
                                    aria-label="YAML Preview"
                                >
                                    <h2 className="text-2xl font-semibold text-ubuntu-orange mb-6 pb-3 border-b-2 border-gray-200">
                                        YAML Preview
                                    </h2>
                                    <div
                                        role="region"
                                        aria-live="polite"
                                        aria-label="Generated YAML output"
                                        className="bg-gray-900 text-gray-100 p-5 rounded-lg font-mono text-sm leading-relaxed whitespace-pre-wrap break-words max-h-[500px] overflow-y-auto"
                                    >
                                        {yaml}
                                    </div>
                                </section>
                            </div>
                        </main>

                        {/* Action Buttons */}
                        <footer className="p-6 bg-gray-50 border-t-2 border-gray-200" role="contentinfo">
                            <div className="flex flex-wrap gap-3 justify-center">
                                <button
                                    onClick={generateYAML}
                                    className="px-5 py-2.5 bg-ubuntu-orange text-white rounded-lg font-semibold hover:bg-ubuntu-orange/90 focus:ring-4 focus:ring-ubuntu-orange/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
                                    aria-label="Generate YAML configuration"
                                >
                                    Generate YAML
                                </button>
                                <button
                                    onClick={downloadYAML}
                                    className="px-5 py-2.5 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 focus:ring-4 focus:ring-green-500/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
                                    aria-label="Download autoinstall.yaml file"
                                >
                                    Download autoinstall.yaml
                                </button>
                                <button
                                    onClick={copyToClipboard}
                                    className="px-5 py-2.5 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 focus:ring-4 focus:ring-gray-500/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
                                    aria-label="Copy YAML to clipboard"
                                >
                                    Copy to Clipboard
                                </button>
                                <label
                                    htmlFor="file-input"
                                    className="px-5 py-2.5 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 focus:ring-4 focus:ring-gray-500/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg cursor-pointer inline-block"
                                    tabIndex={0}
                                    role="button"
                                    aria-label="Load YAML file from disk"
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' || e.key === ' ') {
                                            e.preventDefault();
                                            fileInputRef.current?.click();
                                        }
                                    }}
                                >
                                    Load YAML File
                                </label>
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    id="file-input"
                                    accept=".yaml,.yml"
                                    onChange={loadYAMLFile}
                                    className="sr-only"
                                    aria-label="Choose YAML file to load"
                                />
                                <button
                                    onClick={saveToURL}
                                    className="px-5 py-2.5 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 focus:ring-4 focus:ring-gray-500/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
                                    aria-label="Save configuration to URL for bookmarking"
                                >
                                    Save to Bookmark
                                </button>
                                <button
                                    onClick={clearForm}
                                    className="px-5 py-2.5 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 focus:ring-4 focus:ring-gray-500/50 transition-all transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
                                    aria-label="Clear all form fields"
                                >
                                    Clear Form
                                </button>
                            </div>
                        </footer>
                    </div>
                </div>
            );
        };

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
